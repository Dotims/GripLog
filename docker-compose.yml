# Local Postgres for the API. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: griplog
      POSTGRES_PASSWORD: griplog
      POSTGRES_DB: griplog
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate database the API tests run against.
      - ./apps/api/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U griplog"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
