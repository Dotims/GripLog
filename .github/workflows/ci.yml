name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres for the API integration tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: griplog
          POSTGRES_PASSWORD: griplog
          POSTGRES_DB: griplog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U griplog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://griplog:griplog@localhost:5432/griplog_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
